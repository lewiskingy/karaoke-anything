name: Generate Rust Lockfile

on:
  push:
    branches:
      - agent/add-rust-client-and-architecture

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-rust-client-and-architecture

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        working-directory: client
        run: cargo generate-lockfile

      - name: Commit lockfile
        shell: pwsh
        run: |
          if (git status --porcelain client/Cargo.lock) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/Cargo.lock
            git commit -m "Add Rust dependency lockfile"
            git push origin HEAD:agent/add-rust-client-and-architecture
          }

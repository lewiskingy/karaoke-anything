services:
  karaoke-anything:
    build:
      context: .
      dockerfile: Dockerfile.demucs
      args:
        CONVTASNET_MODEL_REPO: "${CONVTASNET_MODEL_REPO:-cadenzachallenge/ConvTasNet_Lyrics_Causal}"
        CONVTASNET_MODEL_REVISION: "${CONVTASNET_MODEL_REVISION:-main}"
    environment:
      PROCESSOR: "${PROCESSOR:-htdemucs-vocals}"
      DEMUCS_MODEL: "${DEMUCS_MODEL:-htdemucs}"
      DEMUCS_DEVICE: "${DEMUCS_DEVICE:-auto}"
      DEMUCS_SEGMENT_SECONDS: "${DEMUCS_SEGMENT_SECONDS:-6.0}"
      DEMUCS_OVERLAP: "${DEMUCS_OVERLAP:-0.25}"
      DEMUCS_SHIFTS: "${DEMUCS_SHIFTS:-0}"
      DEMUCS_VOCAL_REDUCTION: "${DEMUCS_VOCAL_REDUCTION:-1.0}"
      CONVTASNET_MODEL_PATH: "${CONVTASNET_MODEL_PATH:-/models/convtasnet-lyrics-causal}"
      CONVTASNET_DEVICE: "${CONVTASNET_DEVICE:-auto}"
      CONVTASNET_SEGMENT_SECONDS: "${CONVTASNET_SEGMENT_SECONDS:-1.0}"
      CONVTASNET_VOCAL_REDUCTION: "${CONVTASNET_VOCAL_REDUCTION:-1.0}"
      CONVTASNET_VOCAL_SOURCE_INDEX: "${CONVTASNET_VOCAL_SOURCE_INDEX:-0}"
      CONVTASNET_ACCOMPANIMENT_SOURCE_INDEX: "${CONVTASNET_ACCOMPANIMENT_SOURCE_INDEX:-1}"
      CENTRE_REDUCTION: "${CENTRE_REDUCTION:-0.7}"
      TORCH_HOME: "/models/torch"
    gpus: all
    volumes:
      - demucs-model-cache:/models/torch

volumes:
  demucs-model-cache:
